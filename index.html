<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刀房流動／麻護 未交班・交錯班紀錄</title>
<style>
  :root{
    --bg:#f8f1e5; --card:#fffaf2; --ink:#5a4636; --muted:#a08a76; --line:#eadcc8;
    --teal:#c8a27c; --teal-soft:#f3e6d3; --amber:#c98a4b; --amber-soft:#fbecd6;
    --rose:#c97b6b; --rose-soft:#f8e3dc; --blue:#8c7a5f; --blue-soft:#efe6d6;
    --radius:20px;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Rounded Mplus 1c","SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background-image:radial-gradient(circle at 10% 0%,#fff6e8 0,transparent 40%),radial-gradient(circle at 90% 10%,#f6e7d3 0,transparent 35%);background-attachment:fixed;
    font-size:15px;line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:16px 14px 80px}
  header h1{font-size:20px;margin:4px 0 2px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .status{font-size:12px;color:var(--muted);margin-top:6px}
  .status.warn{color:var(--amber)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
  .stat b{display:block;font-size:24px;line-height:1.2}
  .stat span{font-size:12px;color:var(--muted)}
  @media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card h2{font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .full{grid-column:1/-1}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  label .req{color:var(--rose)}
  input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  textarea{min-height:72px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    color:var(--ink);font:inherit;cursor:pointer}
  .seg button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
  .btn{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
  .btn.primary{background:var(--teal);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .btn.danger{background:var(--rose-soft);color:var(--rose)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  @media (max-width:560px){.filters{grid-template-columns:1fr 1fr}}
  .rec{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
  .rec:hover{border-color:var(--teal)}
  .rec .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
  .t-miss{background:var(--rose-soft);color:var(--rose)}
  .t-cross{background:var(--amber-soft);color:var(--amber)}
  .t-role{background:var(--blue-soft);color:var(--blue)}
  .t-done{background:var(--teal-soft);color:var(--teal)}
  .t-open{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
  .rec .date{font-weight:600;margin-right:4px}
  .rec .who{margin-top:4px;font-size:14px}
  .rec .desc{margin-top:4px;color:var(--muted);font-size:13px;white-space:pre-wrap}
  .rec .meta{margin-top:6px;font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:24px 0}
  .msg{font-size:13px;margin-top:8px}
  .msg.err{color:var(--rose)} .msg.ok{color:var(--teal)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay.show{display:flex}
  .dialog{background:var(--card);border-radius:var(--radius);padding:18px;max-width:340px;width:100%}
  .dialog p{margin:0 0 14px}
  .hidden{display:none}
  /* 奶油風格 */
  header h1{color:#6b4f3a;letter-spacing:.5px}
  .card,.stat{box-shadow:0 4px 14px rgba(160,120,80,.08)}
  .stat b{color:#b07d52}
  input,select,textarea{background:#fdf6ec;border-color:#ecdcc6;border-radius:14px}
  input:focus,select:focus,textarea:focus{outline-color:#d9b48f}
  .seg button{border-radius:999px;background:#fdf6ec;border-color:#ecdcc6}
  .seg button.on{background:#c09068;border-color:#c09068;color:#fff}
  .btn{border-radius:999px}
  .btn.primary{background:#b8875d;color:#fff;box-shadow:0 3px 8px rgba(184,135,93,.35)}
  .btn.primary:active{transform:translateY(1px)}
  .btn.ghost{background:#fffaf2;border-color:#e6d3bb;color:#7a5f48}
  .rec{background:#fffdf8;border-color:#efe2d0;border-radius:16px}
  .rec:hover{border-color:#d9b48f}
  .t-miss{background:#f8e0d8;color:#b8695a}
  .t-cross{background:#fbe9cf;color:#b67a3c}
  .t-role{background:#efe4d2;color:#8a6d50}
  .t-done{background:#e6eedc;color:#6f8a57}
  .t-open{background:#fbf4ea;color:#a08a76;border-color:#eadcc8}
  .msg.ok{color:#7c9a62}
  .dialog{background:#fffaf2}
  a{color:#a9805b}
  .photos{display:flex;gap:8px;flex-wrap:wrap}
  .ph{position:relative;width:88px;height:88px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fdf6ec;cursor:zoom-in}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(90,70,54,.75);color:#fff;font-size:14px;line-height:24px;padding:0;cursor:pointer}
  .photoBtn{display:inline-block;margin-top:8px;font-size:14px;padding:8px 14px}
  #viewer img{max-width:100%;max-height:88vh;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .t-photo{background:#efe4d2;color:#8a6d50}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>刀房流動／麻護 未交班・交錯班紀錄</h1>
    <p>大家共用同一份紀錄，新增後所有人即時看得到。</p>
    <div class="status" id="status">連線中…</div>
    <div class="status" id="authBar"></div>
  </header>

  <div class="card hidden" id="gate">
    <h2>請輸入密碼</h2>
    <form id="pwForm" autocomplete="off" style="display:flex;gap:8px;max-width:320px">
      <input id="g_pw" type="password" inputmode="numeric" placeholder="密碼" style="flex:1">
      <button type="submit" class="btn primary" id="pwBtn">進入</button>
    </form>
    <p class="msg" id="gateText"></p>
    <p style="margin:14px 0 0;font-size:13px"><a href="#" id="loginBtn" style="color:var(--muted)">管理者用 Google 登入</a></p>
  </div>
  <div id="app" class="hidden">

  <div class="stats">
    <div class="stat"><b id="sMiss">–</b><span>本月 未交班</span></div>
    <div class="stat"><b id="sCross">–</b><span>本月 交錯班</span></div>
    <div class="stat"><b id="sRole">–</b><span>本月 流動／麻護</span></div>
    <div class="stat"><b id="sOpen">–</b><span>待追蹤（全部）</span></div>
  </div>

  <form class="card" id="form" autocomplete="off">
    <h2><span id="formTitle">＋ 新增紀錄</span><button type="button" class="btn ghost hidden" id="cancelEdit">取消編輯</button></h2>
    <div class="grid">
      <div><label>日期 <span class="req">*</span></label><input type="date" id="f_date" required></div>
      <div><label>班別 <span class="req">*</span></label>
        <div class="seg" data-field="shift"><button type="button">白班</button><button type="button">小夜</button><button type="button">大夜</button></div></div>
      <div><label>職類 <span class="req">*</span></label>
        <div class="seg" data-field="role"><button type="button">流動</button><button type="button">麻護</button></div></div>
      <div><label>問題類型 <span class="req">*</span></label>
        <div class="seg" data-field="type"><button type="button">未交班</button><button type="button">交錯班</button></div></div>
      <div><label>房號</label><input id="f_room" placeholder="例：OR 5"></div>
      <div><label>手術術式</label><input id="f_patient" placeholder="例：疝氣修補術"></div>
      <div class="full"><label>病人資料 <span style="color:var(--rose);font-size:12px">（只填姓氏，勿填全名、病歷號）</span></label>
        <div style="display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px">
          <div class="seg" data-field="gender"><button type="button">男</button><button type="button">女</button></div>
          <input id="f_surname" maxlength="2" placeholder="姓氏">
          <input id="f_age" type="number" inputmode="numeric" min="0" max="120" placeholder="年齡">
        </div>
      </div>
      <div><label>交班人員（應交班者）</label><input id="f_from"></div>
      <div><label>接班人員</label><input id="f_to"></div>
      <div class="full"><label>情況說明</label><textarea id="f_desc" placeholder="發生什麼事、漏交或交錯的內容（勿寫病歷號）"></textarea></div>
      <div><label>發現／通報者</label><input id="f_finder"></div>
      <div><label>追蹤狀態</label>
        <div class="seg" data-field="status"><button type="button">待追蹤</button><button type="button">已完成</button></div></div>
      <div class="full"><label>處理結果</label><textarea id="f_action" placeholder="後續處理、是否已補交班"></textarea></div>
      <div class="full"><label>照片（空針等證據，可多張）</label>
        <div id="photoBox" class="photos"></div>
        <label class="btn ghost photoBtn">📷 拍照／選照片<input type="file" id="f_photo" accept="image/*" multiple hidden></label>
      </div>
    </div>
    <p style="margin:12px 0 0;font-size:12.5px;color:var(--rose);background:var(--rose-soft);padding:8px 12px;border-radius:12px">⚠️ 為保護病人隱私：病人只填性別、姓氏、年齡，請勿填全名或病歷號；照片也不要拍到病人臉部、手圈或病歷。</p>
    <div class="actions">
      <button type="button" class="btn danger hidden" id="delBtn">刪除</button>
      <button type="submit" class="btn primary" id="saveBtn">儲存紀錄</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </form>

  <section class="card">
    <h2><span>紀錄列表 <small id="count" style="color:var(--muted);font-weight:400"></small></span>
      <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button type="button" class="btn primary" id="exportBtn">⬇︎ 匯出 CSV</button><button type="button" class="btn ghost" id="copyBtn">複製</button></span></h2>
    <div class="filters">
      <input type="month" id="q_month" title="月份">
      <select id="q_role"><option value="">全部職類</option><option>流動</option><option>麻護</option></select>
      <select id="q_type"><option value="">全部類型</option><option>未交班</option><option>交錯班</option></select>
      <select id="q_status"><option value="">全部狀態</option><option>待追蹤</option><option>已完成</option></select>
      <input class="full" id="q_text" placeholder="搜尋姓名、房號、內容…" style="grid-column:1/-1">
    </div>
    <div id="list"><div class="empty">載入中…</div></div>
    <div class="msg" id="listMsg"></div>
  </section>

  <section class="card hidden" id="adminCard">
    <h2><span>成員管理 <small style="color:var(--muted);font-weight:400">（只有你看得到）</small></span></h2>
    <p style="margin:0 0 10px;color:var(--muted);font-size:13px">輸入同事的 Gmail 加入名單，對方用這個 Google 帳號登入就能使用。</p>
    <div class="grid">
      <div><label>Gmail</label><input id="m_email" type="email" placeholder="example@gmail.com" autocapitalize="off"></div>
      <div><label>姓名（方便辨識）</label><input id="m_name" placeholder="王小明"></div>
    </div>
    <div class="actions"><button type="button" class="btn primary" id="m_add">加入名單</button></div>
    <div class="msg" id="m_msg"></div>
    <div id="m_list"></div>
    <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
      <label>同事用的進入密碼</label>
      <div id="pinState" class="meta" style="margin:0 0 8px"></div>
      <div style="display:flex;gap:8px;max-width:320px"><input id="pinNew" inputmode="numeric" placeholder="輸入新密碼" autocomplete="off" style="flex:1"><button type="button" class="btn primary" id="pinSet">設定</button></div>
      <div class="msg" id="pinMsg"></div>
    </div>
  </section>
  </div>
</div>

<div class="overlay" id="viewer"><img id="viewerImg" alt="照片"></div>
<div class="overlay" id="confirm">
  <div class="dialog">
    <p id="confirmText">確定要刪除這筆紀錄嗎？</p>
    <div class="actions"><button class="btn ghost" id="cNo">取消</button><button class="btn danger" id="cYes">刪除</button></div>
  </div>
</div>

<script type="module">
const V="10.12.2";
const ADMIN="jane102310@gmail.com";
const TEAM="orteam@koreabuy.app";
const teamPw=pin=>"orpin-"+pin+"-handover";
let firebaseConfig, initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signInWithEmailAndPassword, createUserWithEmailAndPassword, updatePassword, signOut, onAuthStateChanged,
    getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, where, getDocs;
const UA=navigator.userAgent||"";
const IN_APP=/Instagram|FBAN|FBAV|FB_IAB|Line\/|MicroMessenger|Threads|KAKAOTALK|Messenger/i.test(UA);
const watchdog=setTimeout(()=>{
  const s=document.getElementById("status");
  s.textContent="載入太久沒有回應。請按右上「⋯」用 Safari 或 Chrome 開啟此網址，或檢查網路後重新整理。"; s.className="status warn";
},10000);
try{
  ({ firebaseConfig } = await import("./firebase-config.js?v=2"));
  ({ initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`));
  ({ getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signInWithEmailAndPassword, createUserWithEmailAndPassword, updatePassword, signOut, onAuthStateChanged } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`));
  ({ getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, where, getDocs } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`));
}catch(e){
  clearTimeout(watchdog);
  const s=document.getElementById("status");
  s.textContent="無法載入 Firebase（"+(e&&e.message||e)+"）。請檢查網路，或改用 Safari／Chrome 開啟。"; s.className="status warn";
  throw e;
}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const now = new Date();
const today = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const thisMonth = today.slice(0,7);
let fs=null, auth=null, me=null, records=[], editingId=null, unsub=null;
const seg = { shift:"", role:"", type:"", status:"待追蹤", gender:"" };
const fields = ["room","patient","surname","age","from","to","desc","finder","action"];

function myName(){ if(me && (me.email||"").toLowerCase()===TEAM) return "同仁"; return (me&&(me.displayName||me.email))||""; }
function setMsg(id, text, kind){ const m=$(id); m.textContent=text; m.className="msg"+(kind?" "+kind:""); }
function setStatus(text, warn){ const s=$("status"); s.textContent=text; s.className="status"+(warn?" warn":""); }
function showGate(text, showLogin){ $("gate").classList.remove("hidden"); $("app").classList.add("hidden"); $("gateText").textContent=text; $("gateText").className="msg"+(text?" err":""); }

document.querySelectorAll(".seg").forEach(el=>{
  el.addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; seg[el.dataset.field]=b.textContent; paintSeg(); });
});
function paintSeg(){ document.querySelectorAll(".seg").forEach(el=> el.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.textContent===seg[el.dataset.field]))); }

// ===== 照片 =====
let photos=[], removedPhotoIds=[], photoLoadToken=0, photosLoading=false;
function renderPhotos(){
  const box=$("photoBox"); box.innerHTML="";
  photos.forEach((p,i)=>{
    const d=el("div","ph"); const img=document.createElement("img"); img.src=p.data; img.alt="照片"; d.appendChild(img);
    d.onclick=()=>{ $("viewerImg").src=p.data; $("viewer").classList.add("show"); };
    const x=el("button","x","×"); x.type="button"; x.title="移除";
    x.onclick=ev=>{ ev.stopPropagation(); if(p.id) removedPhotoIds.push(p.id); photos.splice(i,1); renderPhotos(); };
    d.appendChild(x); box.appendChild(d);
  });
}
$("viewer").onclick=()=> $("viewer").classList.remove("show");
function loadImage(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("無法讀取圖片")); }; im.src=u; }); }
async function compress(file){
  const im=await loadImage(file);
  let max=1400, q=0.72, out="";
  for(let t=0;t<6;t++){
    const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(im.naturalWidth*sc); c.height=Math.round(im.naturalHeight*sc);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    out=c.toDataURL("image/jpeg",q);
    if(out.length<700000) return out;
    q=Math.max(0.45,q-0.1); max=Math.round(max*0.8);
  }
  return out;
}
$("f_photo").addEventListener("change", async ev=>{
  const files=[...ev.target.files]; ev.target.value="";
  if(!files.length) return;
  if(photos.length+files.length>8){ setMsg("formMsg","每筆最多 8 張照片。","err"); return; }
  setMsg("formMsg","處理照片中…");
  for(const f of files){ try{ photos.push({data:await compress(f)}); }catch(e){ setMsg("formMsg","有一張照片讀取失敗。","err"); } }
  renderPhotos(); setMsg("formMsg","");
});
async function photoDocsOf(recordId){
  const snap=await getDocs(query(collection(fs,"or_records"),where("recordId","==",recordId)));
  return snap.docs.filter(d=>(d.data()||{}).kind==="photo");
}

function resetForm(){
  photos=[]; removedPhotoIds=[]; photoLoadToken++; photosLoading=false; renderPhotos();
  editingId=null; $("form").reset(); $("f_date").value=today;
  Object.assign(seg,{shift:"",role:"",type:"",status:"待追蹤",gender:""}); paintSeg();
  $("formTitle").textContent="＋ 新增紀錄"; $("saveBtn").textContent="儲存紀錄";
  $("cancelEdit").classList.add("hidden"); $("delBtn").classList.add("hidden");
}
resetForm();
$("q_month").value=thisMonth;
$("cancelEdit").onclick=()=>{ resetForm(); setMsg("formMsg",""); };

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const date=$("f_date").value;
  if(!date||!seg.shift||!seg.role||!seg.type){ setMsg("formMsg","請填寫日期、班別、職類與問題類型。","err"); return; }
  if(photosLoading){ setMsg("formMsg","照片還在載入，請稍等再儲存。","err"); return; }
  const data={date,shift:seg.shift,role:seg.role,type:seg.type,gender:seg.gender||"",status:seg.status||"待追蹤",updatedAt:Date.now(),updatedBy:me.email};
  fields.forEach(f=> data[f]=$("f_"+f).value.trim().slice(0,2000));
  data.surname=data.surname.slice(0,2);
  if(data.age!==""){ const a=parseInt(data.age,10); if(isNaN(a)||a<0||a>120){ setMsg("formMsg","年齡請填 0～120。","err"); return; } data.age=String(a); }
  $("saveBtn").disabled=true;
  try{
    data.photoCount=photos.length;
    let recordId=editingId;
    if(editingId){ await updateDoc(doc(fs,"or_records",editingId),data); }
    else{ data.createdAt=Date.now(); data.createdBy=me.email; data.createdName=myName(); recordId=(await addDoc(collection(fs,"or_records"),data)).id; }
    const newOnes=photos.filter(p=>!p.id);
    if(newOnes.length||removedPhotoIds.length) setMsg("formMsg","上傳照片中…");
    for(const pid of removedPhotoIds){ await deleteDoc(doc(fs,"or_records",pid)); }
    for(const p of newOnes){ await addDoc(collection(fs,"or_records"),{kind:"photo",recordId,data:p.data,createdAt:Date.now(),by:myName()}); }
    const wasEdit=!!editingId;
    resetForm();
    setMsg("formMsg", wasEdit?"已更新。":"已儲存，大家都看得到了。","ok");
  }catch(err){ setMsg("formMsg", err.code==="permission-denied" ? "沒有權限，請聯絡管理者把你加入名單。" : "儲存失敗，請再試一次。","err"); }
  finally{ $("saveBtn").disabled=false; }
});

function startEdit(r){
  editingId=r.id; $("f_date").value=r.date||today;
  fields.forEach(f=> $("f_"+f).value=r[f]||"");
  Object.assign(seg,{shift:r.shift||"",role:r.role||"",type:r.type||"",status:r.status||"待追蹤",gender:r.gender||""}); paintSeg();
  $("formTitle").textContent="✎ 編輯紀錄"; $("saveBtn").textContent="儲存修改";
  $("cancelEdit").classList.remove("hidden"); $("delBtn").classList.remove("hidden");
  setMsg("formMsg",""); $("form").scrollIntoView({behavior:"smooth"});
  photos=[]; removedPhotoIds=[]; renderPhotos();
  if(r.photoCount){
    const tok=++photoLoadToken; photosLoading=true; setMsg("formMsg","載入照片中…");
    photoDocsOf(r.id).then(ds=>{ if(tok!==photoLoadToken) return; photosLoading=false; photos=ds.map(d=>({id:d.id,data:d.data().data})); renderPhotos(); setMsg("formMsg",""); })
      .catch(()=>{ if(tok===photoLoadToken){ photosLoading=false; setMsg("formMsg","照片載入失敗，請重新點開這筆紀錄。","err"); } });
  }
}
$("delBtn").onclick=()=>{ if(editingId){ pendingRemove=null; $("confirmText").textContent="確定要刪除這筆紀錄嗎？"; $("cYes").textContent="刪除"; $("confirm").classList.add("show"); } };
$("cNo").onclick=()=>{ pendingRemove=null; $("confirm").classList.remove("show"); };
$("cYes").onclick=async()=>{
  $("confirm").classList.remove("show");
  if(pendingRemove){ const em=pendingRemove; pendingRemove=null;
    try{ await deleteDoc(doc(fs,"or_members",em)); setMsg("m_msg","已移除。","ok"); }catch(e){ setMsg("m_msg","移除失敗（"+e.code+"）","err"); }
    return; }
  try{ const rid=editingId; for(const d of await photoDocsOf(rid)){ await deleteDoc(d.ref); } await deleteDoc(doc(fs,"or_records",rid)); resetForm(); setMsg("formMsg","已刪除。","ok"); }
  catch(err){ setMsg("formMsg","刪除失敗，可能沒有權限。","err"); }
};
["q_month","q_role","q_type","q_status","q_text"].forEach(id=> $(id).addEventListener("input", render));

function filtered(){
  const m=$("q_month").value, ro=$("q_role").value, ty=$("q_type").value, st=$("q_status").value, tx=$("q_text").value.trim().toLowerCase();
  return records.filter(r=>{
    if(m && !(r.date||"").startsWith(m)) return false;
    if(ro && r.role!==ro) return false;
    if(ty && r.type!==ty) return false;
    if(st && (r.status||"待追蹤")!==st) return false;
    if(tx){ const hay=[r.room,r.patient,r.surname,r.from,r.to,r.desc,r.finder,r.action].join(" ").toLowerCase(); if(!hay.includes(tx)) return false; }
    return true;
  });
}
function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function render(){
  const mon=records.filter(r=>(r.date||"").startsWith(thisMonth));
  $("sMiss").textContent=mon.filter(r=>r.type==="未交班").length;
  $("sCross").textContent=mon.filter(r=>r.type==="交錯班").length;
  $("sRole").textContent=mon.filter(r=>r.role==="流動").length+"／"+mon.filter(r=>r.role==="麻護").length;
  $("sOpen").textContent=records.filter(r=>(r.status||"待追蹤")==="待追蹤").length;
  const list=$("list"); list.innerHTML="";
  const rows=filtered(); $("count").textContent=`（${rows.length} 筆）`;
  if(!rows.length){ list.appendChild(el("div","empty", records.length?"沒有符合條件的紀錄":"還沒有紀錄，從上方新增第一筆吧。")); return; }
  rows.forEach(r=>{
    const card=el("div","rec"), top=el("div","top");
    top.appendChild(el("span","date",`${r.date||""} ${r.shift||""}`));
    top.appendChild(el("span","tag t-role",r.role||""));
    top.appendChild(el("span","tag "+(r.type==="未交班"?"t-miss":"t-cross"),r.type||""));
    const st=r.status||"待追蹤"; top.appendChild(el("span","tag "+(st==="已完成"?"t-done":"t-open"),st));
    if(r.photoCount) top.appendChild(el("span","tag t-photo","📷 "+r.photoCount));
    if(r.room) top.appendChild(el("span",null,r.room));
    card.appendChild(top);
    const pt=[r.surname&&(r.surname+(r.gender==="女"?"小姐":r.gender==="男"?"先生":"")), !r.surname&&r.gender, r.age&&(r.age+"歲")].filter(Boolean).join(" ");
    const who=[pt&&("病人："+pt), r.patient&&("術式："+r.patient), r.from&&("交："+r.from), r.to&&("接："+r.to)].filter(Boolean).join("　");
    if(who) card.appendChild(el("div","who",who));
    if(r.desc) card.appendChild(el("div","desc",r.desc));
    if(r.action) card.appendChild(el("div","desc","處理："+r.action));
    card.appendChild(el("div","meta",[r.finder&&("通報："+r.finder), r.createdName&&("登錄："+r.createdName)].filter(Boolean).join("　")));
    card.addEventListener("click",()=>startEdit(r));
    list.appendChild(card);
  });
}
const EXPORT_HEAD=["日期","班別","職類","問題類型","房號","交班人員","接班人員","手術術式","性別","姓氏","年齡","情況說明","發現／通報者","處理結果","追蹤狀態","照片數","登錄者"];
function exportRows(){ return filtered().map(r=>[r.date||"",r.shift||"",r.role||"",r.type||"",r.room||"",r.from||"",r.to||"",r.patient||"",r.gender||"",r.surname||"",r.age?Number(r.age):"",r.desc||"",r.finder||"",r.action||"",r.status||"待追蹤",r.photoCount||0,r.createdName||""]); }
$("copyBtn").onclick=async()=>{
  const clean=v=>String(v??"").replace(/[\t\r\n]+/g," ");
  const lines=[EXPORT_HEAD.join("\t")].concat(exportRows().map(r=>r.map(clean).join("\t")));
  try{ await navigator.clipboard.writeText(lines.join("\n")); setMsg("listMsg","已複製目前篩選的紀錄，可直接貼到 Excel 或 Google 試算表。","ok"); }
  catch(e){ setMsg("listMsg","無法複製，請改用「匯出 CSV」。","err"); }
};
function saveBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
$("exportBtn").onclick=()=>{
  const rows=exportRows();
  if(!rows.length){ setMsg("listMsg","目前篩選沒有紀錄可以匯出。","err"); return; }
  const m=$("q_month").value;
  const esc=v=>{ const t=String(v??""); return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const csv="\ufeff"+[EXPORT_HEAD,...rows].map(r=>r.map(esc).join(",")).join("\r\n");
  saveBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),`刀房交班紀錄_${m||"全部"}.csv`);
  setMsg("listMsg",`已匯出 ${rows.length} 筆（依目前篩選）。照片不會放進檔案，請在網頁上查看。`,"ok");
};


// ===== 成員管理（只有管理者）=====
let unsubMembers=null, members=[], pendingRemove=null;
function startAdmin(){
  $("adminCard").classList.remove("hidden");
  if(unsubMembers) return;
  unsubMembers=onSnapshot(collection(fs,"or_members"), snap=>{
    members=snap.docs.map(d=>({email:d.id, name:(d.data()||{}).name||"", pin:(d.data()||{}).pin||""})).sort((a,b)=>a.email.localeCompare(b.email));
    renderMembers();
  }, err=> setMsg("m_msg","讀不到名單（"+err.code+"），請確認 Firebase 規則已更新。","err"));
}
function stopAdmin(){ $("adminCard").classList.add("hidden"); if(unsubMembers){unsubMembers();unsubMembers=null;} }
function renderMembers(){
  const team=members.find(m=>m.email===TEAM);
  $("pinState").textContent=team ? (team.pin?`✅ 目前密碼：${team.pin}（要更改就輸入新密碼按「更改」）`:"✅ 已啟用（要更改就輸入新密碼按「更改」）") : "尚未設定：輸入密碼後按「設定」，同事就能用密碼進入。";
  $("pinSet").textContent=team?"更改":"設定";
  const box=$("m_list"); box.innerHTML="";
  box.appendChild(el("div","meta",`目前名單（${members.length} 人）`));
  members.filter(m=>m.email!==TEAM).forEach(m=>{
    const row=el("div","rec"); row.style.cursor="default"; row.style.display="flex"; row.style.alignItems="center"; row.style.gap="8px";
    const t=el("div",null,(m.name?m.name+"　":"")+m.email); t.style.flex="1"; t.style.wordBreak="break-all";
    row.appendChild(t);
    if(m.email!==ADMIN){
      const b=el("button","btn danger","移除"); b.type="button"; b.style.padding="6px 10px";
      b.onclick=()=>{ pendingRemove=m.email; $("confirmText").textContent=`確定要把 ${m.name||m.email} 移出名單嗎？移除後他就不能再使用。`; $("cYes").textContent="移除"; $("confirm").classList.add("show"); };
      row.appendChild(b);
    }
    box.appendChild(row);
  });
}
$("pinSet").onclick=async()=>{
  const pin=$("pinNew").value.trim();
  if(pin.length<4){ setMsg("pinMsg","密碼至少 4 個字。","err"); return; }
  const team=members.find(m=>m.email===TEAM), oldPin=team&&team.pin;
  if(oldPin===pin){ setMsg("pinMsg","新密碼跟目前一樣。","err"); return; }
  $("pinSet").disabled=true; setMsg("pinMsg","處理中…");
  try{
    const a2=getAuth(initializeApp(firebaseConfig,"setup-"+Date.now()));
    if(oldPin){
      const cred=await signInWithEmailAndPassword(a2,TEAM,teamPw(oldPin));
      await updatePassword(cred.user,teamPw(pin));
    }else{
      try{ await createUserWithEmailAndPassword(a2,TEAM,teamPw(pin)); }
      catch(e){
        if(e.code!=="auth/email-already-in-use") throw e;
        try{ await signInWithEmailAndPassword(a2,TEAM,teamPw(pin)); }catch(e2){ throw {code:"pin-mismatch"}; }
      }
    }
    await signOut(a2);
    await setDoc(doc(fs,"or_members",TEAM),{name:"同仁（密碼）",pin,updatedAt:Date.now()});
    $("pinNew").value=""; setMsg("pinMsg",oldPin?`已更改，之後請用新密碼 ${pin} 進入。`:`完成！同事輸入 ${pin} 就能進入。`,"ok");
  }catch(e){
    setMsg("pinMsg", e.code==="pin-mismatch" ? "團隊帳號已用別的密碼建立過：請到 Firebase → Authentication → 使用者，刪掉 orteam@koreabuy.app 後再按一次。" :
      e.code==="auth/operation-not-allowed" ? "Firebase 尚未開啟「電子郵件/密碼」登入方式。" : "失敗（"+(e.code||e.message)+"）","err");
  }finally{ $("pinSet").disabled=false; }
};
$("m_add").onclick=async()=>{
  const email=$("m_email").value.trim().toLowerCase(), name=$("m_name").value.trim().slice(0,50);
  if(!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(email)){ setMsg("m_msg","請輸入正確的 Gmail。","err"); return; }
  $("m_add").disabled=true;
  try{ await setDoc(doc(fs,"or_members",email),{name, addedAt:Date.now()}); $("m_email").value=""; $("m_name").value=""; setMsg("m_msg",`已加入 ${name||email}。`,"ok"); }
  catch(e){ setMsg("m_msg","加入失敗（"+e.code+"），請確認 Firebase 規則已更新。","err"); }
  finally{ $("m_add").disabled=false; }
};

$("pwForm").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const pin=$("g_pw").value.trim();
  if(!pin){ showGate("請輸入密碼。",true); return; }
  $("pwBtn").disabled=true;
  try{ await signInWithEmailAndPassword(auth,TEAM,teamPw(pin)); $("g_pw").value=""; }
  catch(e){ showGate(e.code==="auth/too-many-requests"?"嘗試太多次，請稍後再試。":(String(e.code).includes("network")?"網路不穩，請再試一次。":"密碼不對，請再試一次。"),true); }
  finally{ $("pwBtn").disabled=false; }
});
$("loginBtn").onclick=async(ev)=>{
  ev.preventDefault();
  if(IN_APP){ showGate("App 內建瀏覽器不能用 Google 登入，請改用 Safari 開啟。",true); return; }
  try{ await signInWithPopup(auth,new GoogleAuthProvider()); }
  catch(e){
    if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){ try{ await signInWithRedirect(auth,new GoogleAuthProvider()); return; }catch(e2){ e=e2; } }
    if(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request") return;
    showGate("登入失敗（"+(e.code||e.message)+"）。若在 App 內開啟，請改用 Safari 或 Chrome。",true);
  }
};

function startListening(){
  if(unsub) unsub();
  const timer=setTimeout(()=>setStatus("資料暫時連不到，請檢查網路。",true),10000);
  unsub=onSnapshot(query(collection(fs,"or_records"),orderBy("date","desc"),limit(2000)), snap=>{
    clearTimeout(timer);
    records=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(r=>r.kind!=="photo");
    records.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
    setStatus("已連線・即時同步中"); render();
  }, err=>{
    clearTimeout(timer);
    if(err.code==="permission-denied") { showGate(`這個帳號（${me.email}）沒有權限，請用密碼進入。`,true); }
    else setStatus("連線中斷，請重新整理頁面。",true);
  });
}

if(!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.includes("貼上")){
  clearTimeout(watchdog); setStatus("尚未設定 Firebase：請在 firebase-config.js 貼上設定。",true);
  showGate("網站還沒接上 Firebase，請管理者完成設定。",false);
}else{
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app); fs=getFirestore(app);
  onAuthStateChanged(auth, u=>{
    clearTimeout(watchdog); me=u;
    const bar=$("authBar"); bar.innerHTML="";
    if(!u){ stopAdmin(); if(unsub){unsub();unsub=null;} records=[]; setStatus(""); showGate("",true); return; }
    bar.append(document.createTextNode(`已登入：${myName()}　`));
    const out=el("a",null,"登出"); out.href="#"; out.onclick=e=>{e.preventDefault(); signOut(auth);}; bar.append(out);
    $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
    setStatus("連線中…"); startListening();
    if((u.email||"").toLowerCase()===ADMIN) startAdmin(); else stopAdmin();
  });
}
</script>
